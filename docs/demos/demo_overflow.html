<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overflow Bug Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { purple: '#c084fc' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif; background: #0a0a0f; color: #f4f4f5; }
    </style>
</head>
<body class="min-h-screen py-10 px-4">

    <!-- Container replicating the structure -->
    <div class="max-w-2xl mx-auto flex flex-col gap-10">

        <!-- BEFORE: Reproducing the bug -->
        <div>
            <h2 class="text-xl font-bold mb-4">Before (Bug Reproduction - Narrow Screen)</h2>
            <div class="w-72 bg-zinc-900 border border-zinc-800 rounded-2xl p-4 flex flex-row justify-between items-center gap-2">
                <!-- Mode Toggle (The one that overflows) -->
                <div class="flex w-full bg-zinc-950 p-1.5 rounded-xl shrink-0">
                    <button class="flex-1 flex items-center justify-center gap-2 px-3 py-2 rounded-lg font-bold transition-all text-sm border border-transparent text-zinc-400">
                        <svg class="w-[18px] h-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
                        <span class="whitespace-nowrap">圖卡模式</span>
                    </button>
                    <button class="flex-1 flex items-center justify-center gap-2 px-3 py-2 rounded-lg font-bold transition-all text-sm border bg-[#ebdfff] dark:bg-brand-purple/20 text-brand-purple shadow-sm border-transparent dark:border-brand-purple/20">
                        <svg class="w-[18px] h-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="21" x2="3" y1="6" y2="6"/><line x1="21" x2="9" y1="12" y2="12"/><line x1="21" x2="7" y1="18" y2="18"/></svg>
                        <span class="whitespace-nowrap">文字模式</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- AFTER: Fixed -->
        <div>
            <h2 class="text-xl font-bold mb-4">After (Fixed - Renamed & Scrollable if needed)</h2>
            <div class="w-72 bg-zinc-900 border border-zinc-800 rounded-2xl p-4 flex flex-row justify-between items-center gap-2 overflow-x-auto">
                <!-- Mode Toggle (Fixed) -->
                <div class="flex w-full bg-zinc-950 p-1.5 rounded-xl shrink-0 min-w-min">
                    <button class="flex-1 flex items-center justify-center gap-2 px-3 sm:px-4 py-2 rounded-lg font-bold transition-all text-sm border border-transparent text-zinc-400">
                        <svg class="w-[18px] h-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
                        <span class="whitespace-nowrap">圖卡</span>
                    </button>
                    <button class="flex-1 flex items-center justify-center gap-2 px-3 sm:px-4 py-2 rounded-lg font-bold transition-all text-sm border bg-[#ebdfff] dark:bg-brand-purple/20 text-brand-purple shadow-sm border-transparent dark:border-brand-purple/20">
                        <svg class="w-[18px] h-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="21" x2="3" y1="6" y2="6"/><line x1="21" x2="9" y1="12" y2="12"/><line x1="21" x2="7" y1="18" y2="18"/></svg>
                        <span class="whitespace-nowrap">文字</span>
                    </button>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
